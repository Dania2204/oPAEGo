# Análisis estático de seguridad (SAST) con CodeQL: Python del backend y el
# JavaScript del panel (static/js). Corre en cada PR a main y una vez por semana.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analizar:
    name: Analizar (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          config: |
            paths-ignore:
              - prototipo-nextjs
              - backend/**/migrations
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
