<div class="campo{% if ancho %} ancho{% endif %}{% if campo.errors %} con-error{% endif %}">
  {% if campo.field.widget.input_type == "checkbox" %}
    <label class="casilla">{{ campo }} <span>{{ campo.label }}</span></label>
  {% else %}
    <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} <span class="obligatorio" aria-hidden="true">*</span>{% endif %}</label>
    {{ campo }}
  {% endif %}
  {% if campo.help_text %}<span class="ayuda">{{ campo.help_text }}</span>{% endif %}
  {{ campo.errors }}
</div>
